<text x="345.0" y="98" font-size="12" text-anchor="middle" fill="#2b5d99">짧은 런</text>
<text x="20" y="142" font-size="14" text-anchor="start" fill="#222" font-weight="bold">② 뒤집기 + minrun까지 늘리기 (이진 삽입 정렬)</text>
<rect x="30" y="158" width="30" height="28" fill="#cfe8cf" stroke="#555"/>
<text x="45.0" y="177.0" font-size="13" text-anchor="middle" fill="#222">1</text>
