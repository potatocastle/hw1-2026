<text x="410" y="172" font-size="12" text-anchor="start" fill="#444">실제로는 minrun = 32~64. 짧은 런은 뒤따르는</text>
<text x="410" y="190" font-size="12" text-anchor="start" fill="#444">원소를 이진 삽입 정렬로 끌어와 minrun 길이로 만든다.</text>
<text x="20" y="238" font-size="14" text-anchor="start" fill="#222" font-weight="bold">③ 런 스택 — 불변식이 깨지면 이웃 런끼리 병합</text>
<rect x="30" y="252" width="210" height="24" rx="4" fill="#cfe8cf" stroke="#555"/>
<text x="135.0" y="269.0" font-size="12" text-anchor="middle" fill="#222">Z : 길이 120</text>
<rect x="30" y="278" width="170" height="24" rx="4" fill="#f9d9b5" stroke="#555"/>
<text x="115.0" y="295.0" font-size="12" text-anchor="middle" fill="#222">Y : 길이 70</text>
<rect x="30" y="304" width="150" height="24" rx="4" fill="#d6e4f5" stroke="#555"/>
<text x="105.0" y="321.0" font-size="12" text-anchor="middle" fill="#222">X : 길이 64 (새 런)</text>
<text x="260" y="270" font-size="13" text-anchor="start" fill="#222" font-weight="bold">불변식  Z > Y + X   그리고   Y > X</text>
<text x="260" y="294" font-size="12" text-anchor="start" fill="#444">120 > 70 + 64 ?  아니다 → Z가 X보다 길므로 Y와 X를 병합 (134)</text>
<text x="260" y="316" font-size="12" text-anchor="start" fill="#2b5d99">런 길이가 피보나치처럼 자라므로 스택 높이 = O(log n)</text>
</svg>